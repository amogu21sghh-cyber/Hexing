# Сборка Android-приложения из архива hexstrat-vX.Y.Z.dat (это zip, переименованный в .dat), лежащего в корне репозитория.
# Берётся самый свежий архив по номеру версии. Запускается при загрузке нового .dat и вручную: Actions -> «Android APK» -> Run workflow.
# Файлы: внизу страницы запуска, раздел Artifacts (подробнее в RELEASE.md внутри архива).
name: Android APK

on:
  push:
    paths: ['hexstrat-*.dat']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    env:
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            hexstrat-*.dat
          sparse-checkout-cone-mode: false

      - name: Распаковка свежего архива
        working-directory: .
        run: |
          DAT=$(ls hexstrat-v*.dat | sort -V | tail -1)
          echo "Берём архив: $DAT"
          mkdir src
          unzip -q "$DAT" -d src
          ls src | head -30

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Версия игры
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Шрифты (вшиваются в игру, интернет не нужен)
        run: npm install --no-save @fontsource/fira-sans @fontsource/forum

      - name: Сборка игры в один файл
        run: node build.mjs

      - name: Проверка логики (быстрая)
        run: node test/starts.mjs && node test/mods.mjs

      - name: Проект Android (Capacitor)
        working-directory: src/app
        run: |
          mkdir -p www
          cp ../dist/index.html www/index.html
          npm install
          npx cap add android
          cp -r android-res/. android/app/src/main/res/
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.v }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Отладочный ключ (для проверочной сборки)
        run: |
          mkdir -p ~/.android
          cp app/debug.keystore ~/.android/debug.keystore

      - name: Сборка отладочного APK
        working-directory: src/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hexarchy-${{ steps.ver.outputs.v }}-debug-apk
          path: src/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Релизный APK для RuStore (подпись вашим ключом)
        if: env.KEYSTORE_B64 != ''
        working-directory: src/app/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/hexarchy-${{ steps.ver.outputs.v }}.apk"
          echo "Подпись релизного APK (отпечаток сертификата должен совпадать от версии к версии):"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -E "SHA-256|Signer #1 certificate DN"

      - name: Файл релиза
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: hexarchy-${{ steps.ver.outputs.v }}-rustore-apk
          path: ${{ runner.temp }}/hexarchy-${{ steps.ver.outputs.v }}.apk
          if-no-files-found: error
